<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goal Rush Bigger Shirts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400;0,600;0,800;1,900&display=swap">
<style>
  /* Goal Rush pitch shirts, badges and names 10% bigger, the goals number 20% bigger: screenshots of the live game with the change built in. */
  :root { color-scheme: dark; --y: #FFD21F; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #08080A; color: #fff; font-family: 'Exo 2', Arial, sans-serif; }
  .page { max-width: 1240px; margin: 0 auto; padding: 40px 16px 72px; display: flex; flex-direction: column; gap: 26px; }
  h1 { font: 900 italic 38px/1 'Exo 2'; margin: 0 0 10px; }
  .head p { margin: 0; color: #BDBDC6; font-size: 15px; line-height: 1.5; max-width: 90ch; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
  figure { margin: 0; width: 360px; max-width: 100%; display: flex; flex-direction: column; gap: 10px; }
  figure img { width: 100%; border-radius: 26px; box-shadow: 0 0 0 1px #222228, 0 30px 60px rgba(0,0,0,.6); display: block; }
  figcaption .tag { display: block; font-size: 12px; font-weight: 800; letter-spacing: 1.4px; color: #12F06C; }
  figcaption b { display: block; font: 900 italic 21px/1.1 'Exo 2'; margin: 3px 0; }
  figcaption span { color: #8E8E99; font-size: 13px; line-height: 1.45; }
</style>
</head>
<body>
<div class="page">
  <div class="head">
    <h1>Goal Rush, bigger shirts</h1>
    <p>Your team from the screenshot, set up in the real game. The pitch shirts and badges are 10% bigger, and so are the names under them. The goals number on each shirt is 20% bigger and can now run over the edge of the shirt (Lampard's 177).</p>
  </div>
  <div class="row">
    <figure><img src="goal-rush-bigger/now.png" alt="Goal Rush now"><figcaption><span class="tag">NOW</span><b>As it is live</b><span>Build 54.</span></figcaption></figure>
    <figure><img src="goal-rush-bigger/bigger.png" alt="Goal Rush with bigger shirts"><figcaption><span class="tag">BIGGER</span><b>Shirts, badges, names +10%, goals +20%</b><span>Same phone size (393 x 852).</span></figcaption></figure>
    <figure><img src="goal-rush-bigger/bigger-small-phone.png" alt="Goal Rush with bigger shirts on a small phone"><figcaption><span class="tag">SMALL PHONE</span><b>The same on a 375 x 667 screen</b><span>The shirts shrink with the pitch on short screens, as now; nothing overlaps.</span></figcaption></figure>
  </div>
</div>
</body>
</html>
